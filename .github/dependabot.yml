version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Majors (e.g. next 15→16, react 18→19) are breaking — bump them deliberately
    # as a maintainer PR. Per GitHub docs this only affects version updates:
    # security update PRs are unaffected by ignore.update-types.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      production-dependencies:
        dependency-type: "production"
      development-dependencies:
        dependency-type: "development"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    # Action majors can change workflow config schemas (e.g. labeler v5→v6) —
    # bump those in a reviewed PR, not auto.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
