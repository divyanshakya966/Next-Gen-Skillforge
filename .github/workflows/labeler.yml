name: Labeler

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    name: Apply path labels
    runs-on: ubuntu-latest
    steps:
      - name: Apply labels
        uses: actions/labeler@v7
        with:
          configuration-path: .github/labeler.yml
          sync-labels: false
